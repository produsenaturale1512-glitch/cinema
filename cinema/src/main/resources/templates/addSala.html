<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Adaugă sală</title><link rel="stylesheet" href="/style.css"></head>
<body>
<h2>Adaugă sală</h2>
<form method="post" action="/admin/sala/add">
    <input name="nume" placeholder="Nume sală" required><br><br>
    <input name="randuri" type="number" placeholder="Randuri" required><br><br>
    <input name="locuriPeRand" type="number" placeholder="Locuri pe rand" required><br><br>
    <button type="submit">Salvează</button>
</form>
<p><a href="/admin">Înapoi</a></p>
</body>
</html>
